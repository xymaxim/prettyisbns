name: Update ranges

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --dev --extra ranges

      - name: Update ranges.py
        run: make ranges.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/update-ranges
          delete-branch: true
          add-paths: src/prettyisbns/ranges.py
          commit-message: Update ranges.py
          title: Update ranges.py
          body: |
            Automatically created by the `update-ranges` GitHub workflow.

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
